[project]
name = "tortillas"
version = "0.2.0"
description = "A test runner for SWEB Educational OS (IAIK/sweb)"

authors = [{ name = "Maximilian Seidler" }, { name = "Leo Moser" }]

requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
fancy = ["enlighten"]
dev = ["pytest", "pytest-timeout", "ruff", "pre-commit"]

[project.scripts]
tortillas = "tortillas.__main__:main"

[project.urls]
"Source" = "https://github.com/PaideiaDilemma/Tortillas"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tortillas*"]

[tool.pytest.ini_options]
python_files = "check_*.py"
python_classes = ""
markers = ["integration: requires a built sweb image and QEMU"]
addopts = "--strict-markers"

[tool.ruff]
extend-exclude = ["salsa.py", "sweb"]

[tool.ruff.lint]
select = ["E", "F"]
